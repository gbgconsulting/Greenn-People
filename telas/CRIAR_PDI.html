<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nova Ação de PDI - Greenn People</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-container": "#eceef0",
                        "outline-variant": "#bccac0",
                        "status-critical": "#f43f5e",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#ba5551",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#005137",
                        "secondary-fixed-dim": "#4fdbc8",
                        "secondary": "#006b5f",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#006f64",

                        "on-tertiary": "#ffffff",

                        "primary": "#006948",

                    "borderRadius": {

<style>
        .brand-gradient-bg {
            background-image: linear-gradient(135deg, #059669 0%, #14b8a6 100%);
        }
        .form-input-custom:focus {
            outline: none;
            border: 2px solid #006948;
            background-color: #ffffff;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4 md:p-8">
<div class="w-full max-w-2xl bg-surface-container-lowest border border-border-subtle rounded-xl shadow-[0_2px_4px_rgba(0,0,0,0.04)] overflow-hidden">
<div class="px-gutter pt-8 pb-6 border-b border-border-subtle">
<div class="flex items-center gap-3 mb-2">
<span aria-hidden="true" class="material-symbols-outlined text-primary text-2xl" data-icon="school">school</span>
<h1 class="font-headline-md text-headline-md text-primary">Nova Ação de PDI</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">
                Defina os detalhes da sua próxima meta de desenvolvimento individual.
            </p>
</div>
<form class="px-gutter py-6 space-y-6">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-outline" for="titulo">
                    Título da Ação
                </label>
<input class="w-full bg-surface-container-low border border-transparent rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface transition-all duration-200 form-input-custom focus:ring-0" id="titulo" name="titulo" placeholder="Ex: Curso de Liderança Avançada" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-outline" for="competencia">
                        Competência Relacionada
                    </label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-transparent rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface appearance-none transition-all duration-200 form-input-custom focus:ring-0" id="competencia" name="competencia">
<option disabled="" selected="" value="">Selecione...</option>
<option value="lideranca">Liderança</option>
<option value="comunicacao">Comunicação</option>
<option value="resolucao_problemas">Resolução de Problemas</option>
<option value="tecnica">Habilidade Técnica</option>
</select>
<span aria-hidden="true" class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-outline" for="tipo">
                        Tipo de Desenvolvimento
                    </label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-transparent rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface appearance-none transition-all duration-200 form-input-custom focus:ring-0" id="tipo" name="tipo">
<option disabled="" selected="" value="">Selecione...</option>
<option value="mentoria">Mentoria</option>
<option value="treinamento">Treinamento Formal</option>
<option value="experiencia">Experiência Prática</option>
<option value="educacao">Educação Contínua</option>
</select>
<span aria-hidden="true" class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-outline" for="descricao">
                    Descrição e Objetivos
                </label>
<textarea class="w-full bg-surface-container-low border border-transparent rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface resize-none transition-all duration-200 form-input-custom focus:ring-0" id="descricao" name="descricao" placeholder="Descreva os objetivos que você espera alcançar com esta ação..." rows="4"></textarea>
</div>
<div class="space-y-2 w-full md:w-1/2">
<label class="block font-label-md text-label-md text-outline" for="prazo">
                    Prazo Estimado
                </label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-transparent rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface transition-all duration-200 form-input-custom focus:ring-0" id="prazo" name="prazo" type="date"/>
</div>
</div>
</form>
<div class="px-gutter py-5 bg-surface-bright border-t border-border-subtle flex flex-col-reverse md:flex-row justify-end items-center gap-4 rounded-b-xl">
<button class="w-full md:w-auto px-6 py-2.5 rounded-lg bg-surface-container-lowest border border-border-subtle text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-low transition-colors duration-200" type="button">
                Cancelar
            </button>
<button class="w-full md:w-auto px-6 py-2.5 rounded-lg brand-gradient-bg text-on-primary font-label-md text-label-md shadow-sm hover:-translate-y-[1px] transition-transform duration-200 flex items-center justify-center gap-2" type="submit">
<span aria-hidden="true" class="material-symbols-outlined text-[18px]" data-icon="save">save</span>
                Salvar Ação
            </button>
</div>
</div>
</body></html>
