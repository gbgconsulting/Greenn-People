{% comment %}
  CTA compacto para liberar a próxima etapa no Painel do time.
  Requer: item.avaliacao, item.pode_avancar, item.rotulo_avanco; team_return_url opcional.
{% endcomment %}
{% if item.pode_avancar and item.avaliacao and item.rotulo_avanco %}
<form
  method="post"
  action="{% url 'reviews:advance' item.avaliacao.pk %}"
  class="inline"
>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ team_return_url|default:request.get_full_path }}">
  <button
    type="submit"
    class="inline-flex h-8 max-w-[11rem] items-center justify-center truncate rounded-lg bg-brand-gradient px-2.5 font-ui text-xs font-semibold text-white shadow-sm transition-colors hover:bg-brand-gradient-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-1"
    title="{{ item.rotulo_avanco }}"
  >{{ item.rotulo_avanco }}</button>
</form>
{% endif %}
