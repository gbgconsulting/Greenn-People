{% extends "base.html" %}

{% block title %}Auditoria — Greenn People{% endblock %}

{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-semibold text-slate-800">Auditoria</h1>
  <p class="mt-1 text-slate-500">
    Histórico append-only de alterações sensíveis e acessos negados por escopo.
  </p>
</div>

<form
  method="get"
  class="mb-6 flex flex-wrap items-end gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm"
  role="search"
  aria-label="Filtrar logs de auditoria"
>
  <div>
    <label for="usuario" class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Usuário</label>
    <select
      id="usuario"
      name="usuario"
      class="min-w-[12rem] rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-emerald-500"
    >
      <option value="">Todos</option>
      {% for u in usuarios %}
      <option value="{{ u.pk }}" {% if filtro_usuario == u.pk|stringformat:"s" %}selected{% endif %}>
        {{ u.nome|default:u.email }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="acao" class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Ação</label>
    <select
      id="acao"
      name="acao"
      class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-emerald-500"
    >
      <option value="">Todas</option>
      {% for value, label in acao_choices %}
      <option value="{{ value }}" {% if filtro_acao == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="data_inicio" class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">De</label>
    <input
      type="date"
      id="data_inicio"
      name="data_inicio"
      value="{{ filtro_data_inicio }}"
      class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-emerald-500"
    />
  </div>
  <div>
    <label for="data_fim" class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Até</label>
    <input
      type="date"
      id="data_fim"
      name="data_fim"
      value="{{ filtro_data_fim }}"
      class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-emerald-500"
    />
  </div>
  <div class="flex gap-2">
    <button
      type="submit"
      class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700"
    >Filtrar</button>
    <a
      href="{% url 'audit:list' %}"
      class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
    >Limpar</a>
  </div>
</form>

{% include "audit/auditlog_list_partial.html" %}
{% endblock %}
