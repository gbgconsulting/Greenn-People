<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>{% block title %}Greenn People{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:24px 28px 8px 28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="left" style="font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#059669;">
                    Greenn People
                  </td>
                  <td align="right" width="40">
                    <span style="display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;background-color:#ecfdf5;color:#059669;font-size:14px;font-weight:700;">✓</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 8px 28px;color:#0f172a;font-size:15px;line-height:1.55;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          {% if cta_url and cta_label %}
          <tr>
            <td style="padding:8px 28px 28px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#059669" style="border-radius:8px;">
                    <a href="{{ cta_url }}" style="display:inline-block;padding:12px 22px;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px;">
                      {{ cta_label }}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          {% endif %}
          <tr>
            <td style="padding:0 28px 24px 28px;border-top:1px solid #e2e8f0;">
              <p style="margin:16px 0 0 0;font-size:12px;line-height:1.5;color:#64748b;">
                {% block footer %}
                Greenn People — mensagem automática, não responda este e-mail.
                {% endblock %}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
