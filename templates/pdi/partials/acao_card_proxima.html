{% comment %}
  Card compacto de ação pendente — coluna "Próximas ações".
{% endcomment %}
<article
  id="acao-{{ acao.pk }}"
  class="rounded-xl border border-line bg-surface-card p-5 shadow-[0_2px_4px_rgba(0,0,0,0.04)]"
>
  <div class="mb-2">
    <span class="font-ui text-xs font-semibold uppercase tracking-wider text-emerald-700">Pendente</span>
  </div>
  <h4 class="font-display text-base font-medium leading-snug text-slate-800">{{ acao.descricao }}</h4>
  <div class="mt-3 flex flex-wrap items-center gap-3 font-ui text-xs text-slate-500">
    <div class="flex items-center gap-1.5">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4 shrink-0 text-slate-400" aria-hidden="true">
        <path fill-rule="evenodd" d="M3 4.25A2.25 2.25 0 0 1 5.25 2h5.5A2.25 2.25 0 0 1 13 4.25v2a.75.75 0 0 1-1.5 0v-2a.75.75 0 0 0-.75-.75h-5.5a.75.75 0 0 0-.75.75v11.5c0 .414.336.75.75.75h5.5a.75.75 0 0 0 .75-.75v-2a.75.75 0 0 1 1.5 0v2A2.25 2.25 0 0 1 10.75 18h-5.5A2.25 2.25 0 0 1 3 15.75V4.25Z" clip-rule="evenodd" />
        <path fill-rule="evenodd" d="M6 10a.75.75 0 0 1 .75-.75h9.546l-1.95-1.95a.75.75 0 1 1 1.06-1.06l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.75.75 0 1 1-1.06-1.06l1.95-1.95H6.75A.75.75 0 0 1 6 10Z" clip-rule="evenodd" />
      </svg>
      <span>Prazo: {{ acao.prazo|date:"d M, Y" }}</span>
    </div>
    <div class="flex items-center gap-1.5">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4 shrink-0 text-slate-400" aria-hidden="true">
        <path d="M10 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM6 8a2 2 0 1 1 4 0 2 2 0 0 1-4 0ZM1.49 15.326a.78.78 0 0 1-.358-.442 3 3 0 0 1 4.308-3.516 6.484 6.484 0 0 0-1.305 2.08 3.384 3.384 0 0 1-2.647 1.878ZM19.51 15.326a3.384 3.384 0 0 1-2.647-1.878 6.484 6.484 0 0 0-1.305-2.08 3 3 0 0 1 4.308 3.516.78.78 0 0 1-.356.442Z" />
      </svg>
      <span>{{ responsavel_nome }}</span>
    </div>
  </div>

  {% if pode_editar_acoes %}
  <div class="mt-4 border-t border-line pt-3">
    <label for="acao-status-{{ acao.pk }}" class="mb-1.5 block font-ui text-xs font-semibold text-slate-500">Status</label>
    <select
      id="acao-status-{{ acao.pk }}"
      name="status"
      class="w-full rounded-lg border border-line bg-white px-3 py-2 font-ui text-sm text-slate-700 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-emerald-500"
      hx-post="{% url 'pdi:action_status' acao.pk %}"
      hx-target="#acao-list"
      hx-swap="innerHTML"
      hx-include="this"
      hx-indicator="#htmx-indicator"
    >
      {% for value, label in status_choices %}
      <option value="{{ value }}" {% if acao.status == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <div class="mt-3 flex flex-wrap items-center gap-2">
      <button
        type="button"
        class="font-ui text-xs font-semibold text-emerald-700 transition-colors hover:text-emerald-800"
        hx-get="{% url 'pdi:action_edit_modal' acao.pk %}"
        hx-target="#modal-container"
        hx-swap="innerHTML"
        hx-indicator="#htmx-indicator"
      >
        Editar
      </button>
      <span class="text-slate-300" aria-hidden="true">·</span>
      <button
        type="button"
        class="font-ui text-xs font-semibold text-rose-600 transition-colors hover:text-rose-700"
        hx-post="{% url 'pdi:action_delete' acao.pk %}"
        hx-target="#acao-list"
        hx-swap="innerHTML"
        hx-confirm="Remover esta ação do PDI?"
        hx-indicator="#htmx-indicator"
      >
        Remover
      </button>
    </div>
  </div>
  {% endif %}
</article>
