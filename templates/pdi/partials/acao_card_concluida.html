{% comment %}
  Card de ação concluída — coluna lateral do board PDI.
{% endcomment %}
<article
  id="acao-{{ acao.pk }}"
  class="rounded-xl border border-line bg-surface-card p-5 opacity-80 shadow-[0_2px_4px_rgba(0,0,0,0.04)]"
>
  <div class="mb-2 flex items-start justify-between gap-3">
    <h4 class="font-ui text-sm font-medium leading-snug text-slate-700 line-through decoration-slate-400/70">{{ acao.descricao }}</h4>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5 shrink-0 text-emerald-600" aria-hidden="true">
      <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" />
    </svg>
  </div>
  <p class="font-ui text-xs text-slate-500">
    Concluído em: {{ acao.updated_at|date:"d M, Y" }}
  </p>

  {% if pode_editar_acoes %}
  <div class="mt-3 border-t border-line pt-3">
    <label for="acao-status-{{ acao.pk }}" class="sr-only">Atualizar status da ação</label>
    <select
      id="acao-status-{{ acao.pk }}"
      name="status"
      class="w-full rounded-lg border border-line bg-white px-3 py-2 font-ui text-sm text-slate-700 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-emerald-500"
      hx-post="{% url 'pdi:action_status' acao.pk %}"
      hx-target="#acao-list"
      hx-swap="innerHTML"
      hx-include="this"
      hx-indicator="#htmx-indicator"
    >
      {% for value, label in status_choices %}
      <option value="{{ value }}" {% if acao.status == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  {% endif %}
</article>
