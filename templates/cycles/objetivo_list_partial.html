<div id="list-container">
<div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
  <table class="min-w-full divide-y divide-slate-200 text-left text-sm">
    <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
      <tr>
        <th class="px-4 py-3 font-medium">Descrição</th>
        <th class="px-4 py-3 font-medium">Metas</th>
        <th class="px-4 py-3 font-medium text-right">Ações</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
      {% for objetivo in objetivos %}
      <tr class="hover:bg-slate-50" id="objetivo-row-{{ objetivo.pk }}">
        <td class="px-4 py-3 text-slate-800">{{ objetivo.descricao|truncatechars:160 }}</td>
        <td class="px-4 py-3 text-slate-600">{{ objetivo.metas_count }}</td>
        <td class="px-4 py-3 text-right">
          <div class="flex flex-wrap items-center justify-end gap-2">
            <a
              href="{% url 'cycles:objetivo_update' ciclo.pk objetivo.pk %}"
              class="text-emerald-700 hover:text-emerald-800"
            >Editar</a>
            <span class="text-slate-300">|</span>
            <a
              href="{% url 'cycles:objetivo_delete' ciclo.pk objetivo.pk %}"
              class="text-rose-600 hover:text-rose-700"
            >Excluir</a>
          </div>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3" class="px-4 py-8 text-center text-slate-500">
          Nenhum objetivo estratégico neste ciclo.
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% include "components/pagination.html" with page_obj=page_obj %}
</div>
